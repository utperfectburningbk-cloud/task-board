<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>タスク管理ボード</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#3e4149">
<meta name="apple-mobile-web-app-title" content="タスク">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; overscroll-behavior:none; }
  body{
    font-family:'Noto Sans JP',system-ui,-apple-system,sans-serif;
    background:oklch(0.975 0.006 90);
    color:oklch(0.28 0.012 260);
    -webkit-text-size-adjust:100%;
  }
  #app{ position:relative; width:100%; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
  button{ font-family:inherit; }
  input,textarea{ font-family:inherit; }
  @keyframes toastIn{ from{ opacity:0; transform:translate(-50%,12px);} to{ opacity:1; transform:translate(-50%,0);} }
  @keyframes modalIn{ from{ opacity:0; transform:translateY(10px) scale(.985);} to{ opacity:1; transform:translateY(0) scale(1);} }
  /* 縦向き・狭幅ではボタンのラベルを畳んでアイコンのみに */
  @media (max-width:900px){ .btn-label{ display:none; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ============================================================
   定数
   ============================================================ */
var APP_VERSION = '1.7.1';    // 更新時は sw.js の CACHE も同じ値に上げること
var STORE_KEY = 'lrt-task-board-v1';
var CARD_CAP  = 4;            // 各象限の既定表示件数（超過分は折りたたむ）
var ARCHIVE_DELAY = 4200;     // 完了 → 自動アーカイブまで(ms)
var TOAST_DELAY   = 4600;

var QUAD_DEFS = [
  { k:'q1', u:1, i:1, title:'すぐやる',       sub:'短期', hue:30  },
  { k:'q2', u:0, i:1, title:'計画して進める', sub:'長期', hue:250 },
  { k:'q3', u:1, i:0, title:'さばく・任せる', sub:'',     hue:196 },
  { k:'q4', u:0, i:0, title:'後回し・見送り', sub:'',     hue:260 }
];
var PROJ_GROUP_MIN = 8;       // これ以上の案件数で「絞り込み」と「最近使った案件」を出す
var RECENT_PROJ_MAX = 3;      // 「最近使った案件」に並べる件数
var PALETTE_HUES = [0,30,60,90,120,150,180,210,240,270,300,330];

/* ============================================================
   日付ユーティリティ
   ============================================================ */
function today(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
function iso(d){
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}
function daysTo(due){ return Math.round((new Date(due+'T00:00:00') - today()) / 86400000); }
function todayLabel(){
  var d = today(), w = ['日','月','火','水','木','金','土'][d.getDay()];
  return d.getFullYear() + '年 ' + (d.getMonth()+1) + '月' + d.getDate() + '日（' + w + '）';
}
function fmtDue(due){ if(!due) return '期日未定'; var x = new Date(due+'T00:00:00'); return '〆 ' + (x.getMonth()+1) + '/' + x.getDate(); }
/* 並び替え用。期日なしは末尾に送る */
function dueSortKey(t){ return t.due ? daysTo(t.due) : Infinity; }

/* 期限接近ルール: 未定 / 超過 / 当日 / 3日以内 / それ以外 */
function dstate(due){
  if(!due) return { k:'none', n:null };
  var n = daysTo(due);
  if(n < 0)  return { k:'over',  n:n };
  if(n === 0)return { k:'today', n:n };
  if(n <= 3) return { k:'soon',  n:n };
  return { k:'norm', n:n };
}
function dueColors(k){
  if(k === 'over') return { bg:'oklch(0.955 0.05 30)',  bd:'oklch(0.64 0.17 30)', txt:true  };
  if(k === 'today')return { bg:'oklch(0.96 0.045 60)',  bd:'oklch(0.72 0.15 58)', txt:true  };
  if(k === 'soon') return { bg:'oklch(0.968 0.03 80)',  bd:'oklch(0.8 0.11 78)',  txt:false };
  return { bg:'oklch(0.995 0.003 90)', bd:'oklch(0.9 0.006 95)', txt:false };
}
function badgeText(ds){
  if(ds.k === 'over')  return (-ds.n) + '日超過';
  if(ds.k === 'today') return '本日';
  if(ds.k === 'soon')  return 'あと' + ds.n + '日';
  return '';
}

/* ---- 案件の着工日 ----
   着工前 / 当日 / 着工済み / 未設定 の4状態。
   着工前は「あと何日」、着工済みは「経過何日」を見せる。 */
function startState(s){
  if(!s) return { k:'none', n:null };
  var n = daysTo(s);
  if(n > 0)  return { k:'before', n:n };
  if(n === 0)return { k:'today',  n:0 };
  return { k:'after', n:n };
}
function startText(st){
  if(st.k === 'none')   return '着工日 未設定';
  if(st.k === 'today')  return '本日着工';
  if(st.k === 'before') return '着工まで' + st.n + '日';
  return '着工済み ' + (-st.n) + '日';
}
function startChip(s){
  var st = startState(s), bg, col;
  if(st.k === 'today'){                       bg = 'oklch(0.72 0.15 58)';  col = 'oklch(0.99 0.01 60)'; }
  else if(st.k === 'before' && st.n <= 30){   bg = 'oklch(0.94 0.06 80)';  col = 'oklch(0.42 0.09 70)'; }
  else if(st.k === 'before'){                 bg = 'oklch(0.95 0.015 250)';col = 'oklch(0.45 0.04 250)'; }
  else if(st.k === 'after'){                  bg = 'oklch(0.94 0.005 95)'; col = 'oklch(0.5 0.01 260)'; }
  else {                                      bg = 'transparent';          col = 'oklch(0.68 0.008 260)'; }
  return { text:startText(st), style:'font-size:11px; font-weight:700; padding:3px 9px; border-radius:7px; white-space:nowrap; background:' + bg + '; color:' + col + ';' };
}
/* 着工日の並び順: ①これから着工（近い順） ②着工済み（新しい順） ③未設定 */
function projStartRank(p){
  if(!p || !p.start) return [2, 0];
  var n = daysTo(p.start);
  return n >= 0 ? [0, n] : [1, -n];
}
function cmpProjStart(a, b){
  var ra = projStartRank(a), rb = projStartRank(b);
  return (ra[0] - rb[0]) || (ra[1] - rb[1]) || String(a && a.name).localeCompare(String(b && b.name), 'ja');
}

/* ============================================================
   DOM ヘルパ
   ============================================================ */
function h(tag, props){
  var el = document.createElement(tag), i, k, c;
  props = props || {};
  for(k in props){
    if(!Object.prototype.hasOwnProperty.call(props, k)) continue;
    var v = props[k];
    if(v == null || v === false) continue;
    if(k === 'style')       el.style.cssText = v;
    else if(k === 'text')   el.textContent = v;
    else if(k === 'html')   el.innerHTML = v;
    else if(k === 'ref')    v(el);
    else if(k.slice(0,2) === 'on') el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for(i = 2; i < arguments.length; i++){
    c = arguments[i];
    if(c == null || c === false) continue;
    if(Array.isArray(c)) c.forEach(function(x){ if(x != null && x !== false) el.appendChild(x); });
    else if(typeof c === 'string') el.appendChild(document.createTextNode(c));
    else el.appendChild(c);
  }
  return el;
}
function spacer(){ return h('span', { style:'flex:1;' }); }

/* ============================================================
   永続化
   ============================================================ */
/* 初回起動は空のボードから。案件もタスクも各自がゼロから登録する。
   （サンプルを実案件と取り違えるのを避けるため、あえて何も入れない） */
function seed(){
  return { projects:[], tasks:[] };
}
/* 読み込みは「壊れていたら空で作り直す」ことを絶対にしない。
   読めなかった中身は別キーへ退避し、画面にも警告を出す。
   ここで黙って空を返すと、次の保存で元データを上書きしてしまうため。 */
function load(){
  var raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); }
  catch(e){ var s0 = seed(); s0.loadError = 'storage'; return s0; }

  if(!raw) return seed();

  var d = null;
  try{ d = JSON.parse(raw); }catch(e){ /* 下で退避する */ }

  if(!d || !Array.isArray(d.projects) || !Array.isArray(d.tasks)){
    try{
      // 同じ内容を既に退避済みなら増やさない（開き直すたびに溜まるのを防ぐ）
      var dup = false, i;
      for(i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(k && k.indexOf(STORE_KEY + '.recover.') === 0 && localStorage.getItem(k) === raw){ dup = true; break; }
      }
      if(!dup) localStorage.setItem(STORE_KEY + '.recover.' + Date.now(), raw);
    }catch(e){}
    var s1 = seed();
    s1.loadError = 'broken';
    return s1;
  }
  // v1.2.1 以前の手書きデータ（ink）は読み飛ばす。
  // 次回の保存で自動的に消え、容量も解放される
  return {
    projects:d.projects, tasks:d.tasks,
    owner:d.owner || '', backedUpAt:d.backedUpAt || null,
    hadInk: !!d.ink
  };
}
function snapshot(){
  return {
    app:'lrt-task-board', version:APP_VERSION, savedAt:new Date().toISOString(),
    owner:S.owner, projects:S.projects, tasks:S.tasks,
    backedUpAt:S.backedUpAt || null
  };
}
/* 保存に失敗したことを黙って握りつぶさない。
   握りつぶすと「入力したのに保存されていない」状態に気づけないため、
   画面上部に警告を出し続けて、書き出しでの退避を促す。 */
function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(snapshot()));
    S.saveError = null;
  }catch(e){
    S.saveError = (e && e.name === 'QuotaExceededError') ? 'quota' : 'failed';
  }
}

/* ============================================================
   状態
   ============================================================ */
var boot = load();
var S = {
  view:'matrix',
  projects:boot.projects,
  tasks:boot.tasks,
  owner:boot.owner || '',
  backedUpAt:boot.backedUpAt || null,
  filter:[], sort:'due', expanded:{},
  filterOpen:false, archiveOpen:false, settingsOpen:false, triageOpen:false,
  projectsOpen:false, paletteFor:null,
  add:null, edit:null, newProjName:'', newProjStart:'',
  updateReady:false,
  loadError:boot.loadError || null,   // 保存データを読めなかった
  saveError:null,                     // 保存できていない
  toast:null
};
// 手書き廃止前のデータが残っていれば、この起動で ink を落として保存し直す
if(boot.hadInk) save();

var timers = {};      // 完了 → アーカイブ の予約
var toastTimer = null;
var swipe = null;     // スワイプ中の一時状態
var justSwiped = false;

function setState(patch, opts){
  Object.assign(S, patch);
  if(!opts || opts.persist !== false) save();
  if(!opts || opts.render !== false) render();
}

/* ============================================================
   参照系
   ============================================================ */
function proj(id){
  for(var i=0;i<S.projects.length;i++) if(S.projects[i].id === id) return S.projects[i];
  return { name:'—', hue:260 };
}
function projColor(hue){ return 'oklch(0.56 0.11 ' + hue + ')'; }

/* ID は時刻だけだと同じミリ秒内の連続作成で衝突し、
   別々のはずの案件・タスクが同一視されて片方が巻き添えで消える。
   通し番号を足して必ず一意にする。 */
var uidSeq = 0;
function uid(prefix){ uidSeq += 1; return prefix + Date.now().toString(36) + '-' + uidSeq.toString(36); }

/* 既存の案件色から最も離れた色相を選ぶ。
   固定パレットの使い回しだと件数が増えたとき色が重複し、
   案件の見分けがつかなくなるため、都度いちばん空いている色相を割り当てる。 */
function hueGap(h, used){
  var min = 360, i, d;
  for(i = 0; i < used.length; i++){
    d = Math.abs(h - used[i]) % 360;
    if(d > 180) d = 360 - d;
    if(d < min) min = d;
  }
  return min;
}
function nextHue(){
  var used = S.projects.map(function(p){ return p.hue; });
  if(used.length === 0) return 250;
  var best = 0, bestGap = -1, h;
  for(h = 0; h < 360; h += 5){
    var g = hueGap(h, used);
    if(g > bestGap){ bestGap = g; best = h; }
  }
  return best;
}

/* 案件の絞り込み。アーカイブ済みは新規タスクの候補から外すが、
   実体は消さない（過去タスクが名前と色を参照しているため） */
function pickerProjects(){ return S.projects.filter(function(p){ return !p.arch; }); }
function projTaskCount(id){
  var a = 0, d = 0;
  S.tasks.forEach(function(t){ if(t.pj === id){ if(t.arch) d++; else a++; } });
  return { active:a, done:d, total:a + d };
}
function touchProj(id){
  var p = proj(id);
  if(p && p.id) p.usedAt = Date.now();
}

function task(id){
  for(var i=0;i<S.tasks.length;i++) if(S.tasks[i].id === id) return S.tasks[i];
  return null;
}
function activeTasks(){
  return S.tasks.filter(function(t){
    return !t.arch && (S.filter.length === 0 || S.filter.indexOf(t.pj) >= 0);
  });
}
function isUnclassified(t){ return t.u == null; }   // 緊急度・重要度が未設定
function priRank(t){ if(t.u == null) return 4; return (t.u && t.i) ? 0 : t.i ? 1 : t.u ? 2 : 3; }
function priTag(t){ if(t.u == null) return '未分類'; if(t.u && t.i) return '重要・緊急'; if(t.i) return '重要'; if(t.u) return '緊急'; return '—'; }
function unclassifiedTasks(){ return activeTasks().filter(isUnclassified); }

/* ============================================================
   操作
   ============================================================ */
function completeTask(id){
  var t = task(id); if(!t) return;
  if(t.done){                                   // 完了の取り消し
    clearArchiveTimer(id);
    t.done = false;
    setState({ toast:null });
    return;
  }
  t.done = true;
  setState({});
  timers[id] = setTimeout(function(){
    var x = task(id);
    if(x){ x.arch = true; }
    delete timers[id];
    setState({ toast:null });
  }, ARCHIVE_DELAY);
  showToast('タスクを完了しました', function(){
    clearArchiveTimer(id);
    var x = task(id); if(x) x.done = false;
    setState({});
  });
}
function clearArchiveTimer(id){
  if(timers[id]){ clearTimeout(timers[id]); delete timers[id]; }
}
function deleteTask(id){
  var t = task(id); if(!t) return;
  clearArchiveTimer(id);
  setState({ tasks:S.tasks.filter(function(x){ return x.id !== id; }) });
  showToast('タスクを削除しました', function(){
    setState({ tasks:[t].concat(S.tasks) });
  });
}
function restoreTask(id){
  clearArchiveTimer(id);
  var t = task(id); if(!t) return;
  t.arch = false; t.done = false;
  setState({});
}
function showToast(text, undo){
  if(toastTimer) clearTimeout(toastTimer);
  setState({ toast:{ text:text, undo:undo } }, { persist:false });
  toastTimer = setTimeout(function(){ setState({ toast:null }, { persist:false }); }, TOAST_DELAY);
}

/* ---- スワイプ削除 ---- */
function swDown(e, id){
  swipe = { id:id, x:e.clientX, el:e.currentTarget, dx:0 };
  justSwiped = false;
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
}
function swMove(e){
  if(!swipe) return;
  var dx = e.clientX - swipe.x;
  if(dx > 0) dx = 0;
  if(dx < -150) dx = -150;
  swipe.dx = dx;
  if(dx < -6) justSwiped = true;
  swipe.el.style.transition = 'none';
  swipe.el.style.transform = 'translateX(' + dx + 'px)';
  var bg = swipe.el.parentNode.querySelector('[data-del]');
  if(bg) bg.style.opacity = Math.min(1, -dx / 90);
}
function swUp(){
  if(!swipe) return;
  var s = swipe; swipe = null;
  var bg = s.el.parentNode.querySelector('[data-del]');
  if(s.dx < -90){
    s.el.style.transition = 'transform .16s';
    s.el.style.transform = 'translateX(-110%)';
    setTimeout(function(){ deleteTask(s.id); }, 150);
  }else{
    s.el.style.transition = 'transform .16s';
    s.el.style.transform = 'translateX(0)';
    if(bg) bg.style.opacity = 0;
  }
}

/* ---- 追加フロー ----
   緊急度・重要度と期日は省略できる。省略したタスクは「未分類」に入り、
   あとで振り分けドロワーやリスト画面から設定する。 */
function openAdd(){
  setState({ add:{ step:1, pj:null, title:'', u:null, i:null, due:'' }, newProjName:'', newProjStart:'' }, { persist:false });
}
function closeAdd(){ setState({ add:null }, { persist:false }); }
function addBack(){
  var a = S.add; if(!a) return;
  if(a.step === 1){ closeAdd(); return; }
  a.step -= 1; setState({}, { persist:false });
}
/* 実際にタスクを登録する。u が null のままなら未分類として入る */
function commitAdd(){
  var a = S.add; if(!a || !a.title.trim()) return;
  var id = uid('n');
  var t = { id:id, pj:a.pj, t:a.title.trim(), u:a.u, i:a.i, due:a.due || '', done:false, arch:false };
  touchProj(a.pj);               // 次回の追加で「最近使った案件」の上位に出す
  setState({ tasks:[t].concat(S.tasks), add:null });
  showToast(t.u == null ? '未分類に追加しました' : 'タスクを追加しました', function(){
    setState({ tasks:S.tasks.filter(function(x){ return x.id !== id; }) });
  });
}
function addNext(){
  var a = S.add; if(!a) return;
  if(a.step === 1){ if(!a.pj) return; a.step = 2; setState({}, { persist:false }); return; }
  if(a.step === 2){ if(!a.title.trim()) return; a.step = 3; setState({}, { persist:false }); return; }
  commitAdd();                 // step 3: 緊急度・重要度・期日は任意
}
/* タスク名を入れた段階で、振り分けを後回しにして登録する。
   step3 まで進んで緊急度・重要度・期日を入れていても、「あとで振り分け」を
   選んだ以上はいったん未設定に戻して未分類として登録する。 */
function addQuick(){
  var a = S.add; if(!a) return;
  a.u = null; a.i = null; a.due = '';
  commitAdd();
}
function addNewProj(){
  var n = S.newProjName.trim(); if(!n) return;
  var id = uid('p');
  S.projects = S.projects.concat([{ id:id, name:n, hue:nextHue(), start:S.newProjStart || '', usedAt:Date.now() }]);
  if(S.add) S.add.pj = id;
  setState({ newProjName:'', newProjStart:'' });
}

/* ---- 案件の整理 ---- */
function openProjects(){ setState({ projectsOpen:true, paletteFor:null }, { persist:false }); }
function closeProjects(){ setState({ projectsOpen:false, paletteFor:null }, { persist:false }); }
function renameProj(id, name){
  var p = proj(id);
  if(p && p.id){ p.name = name; save(); }   // 入力中は再描画しない（フォーカスが飛ぶため）
}
function setProjHue(id, hue){
  var p = proj(id);
  if(p && p.id) p.hue = hue;
  setState({ paletteFor:null });
}
function setProjStart(id, v){
  var p = proj(id);
  if(p && p.id) p.start = v || '';
  setState({});
}
function toggleProjArchive(id){
  var p = proj(id); if(!p || !p.id) return;
  if(!p.arch){
    var c = projTaskCount(id);
    if(c.active > 0 && !confirm('「' + p.name + '」には未完了のタスクが ' + c.active + '件あります。\n\n' +
        'アーカイブすると新規タスクの案件候補から外れますが、\n既存のタスクはボードに残ります。')) return;
    p.arch = true;
    if(c.active === 0) S.filter = S.filter.filter(function(x){ return x !== id; });
  }else{
    p.arch = false;
  }
  setState({});
}
function deleteProj(id){
  var p = proj(id); if(!p || !p.id) return;
  if(projTaskCount(id).total > 0) return;    // タスクが残っている案件は消させない
  if(!confirm('案件「' + p.name + '」を削除します。よろしいですか？')) return;
  S.filter = S.filter.filter(function(x){ return x !== id; });
  setState({ projects:S.projects.filter(function(x){ return x.id !== id; }) });
}

/* ---- 編集フロー ---- */
function openEdit(id){
  if(justSwiped){ justSwiped = false; return; }
  var t = task(id); if(!t) return;
  setState({ edit:{ id:id, pj:t.pj, title:t.t, u:t.u, i:t.i, due:t.due } }, { persist:false });
}
function closeEdit(){ setState({ edit:null }, { persist:false }); }
function saveEdit(){
  var e = S.edit; if(!e) return;
  var t = task(e.id);

/* ============================================================
   バックアップ（書き出し / 読み込み）
   localStorage は端末・ブラウザごとに独立し、Safari が消すこともある。
   機種変更やデータ消失に備える唯一の手段なので、明示的に持たせている。
   ============================================================ */
function exportData(){
  S.backedUpAt = new Date().toISOString();
  var blob = new Blob([JSON.stringify(snapshot(), null, 2)], { type:'application/json' });
  var url = URL.createObjectURL(blob);
  var d = today();
  var who = (S.owner || 'board').replace(/[\\\/:*?"<>|\s]+/g, '_').replace(/^_|_$/g, '');
  var a = document.createElement('a');
  a.href = url;
  a.download = 'taskboard_' + who + '_' + iso(d).replace(/-/g,'') + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  save();
  showToast('バックアップを書き出しました', null);
}
function importData(file){
  var reader = new FileReader();
  reader.onload = function(){
    var d;
    try{ d = JSON.parse(reader.result); }
    catch(e){ alert('読み込めませんでした。書き出したJSONファイルを選んでください。'); return; }
    if(!d || !Array.isArray(d.projects) || !Array.isArray(d.tasks)){
      alert('このファイルはタスクボードのバックアップではないようです。');
      return;
    }
    var n = d.tasks.filter(function(t){ return !t.arch; }).length;
    if(!confirm('いまのボードを、このバックアップで置き換えます。\n\n' +
                '書き出し日時: ' + (d.savedAt ? new Date(d.savedAt).toLocaleString('ja-JP') : '不明') + '\n' +
                '案件 ' + d.projects.length + '件 / 未完了タスク ' + n + '件\n\n' +
                '※ いまボードにあるタスクは戻せません。')) return;
    Object.keys(timers).forEach(clearArchiveTimer);
    // 旧バージョンのバックアップに含まれる ink（手書き）は読み飛ばす
    setState({
      projects:d.projects, tasks:d.tasks,
      owner:d.owner || S.owner, backedUpAt:d.backedUpAt || null,
      filter:[], expanded:{}, settingsOpen:false, toast:null
    });
    showToast('バックアップを読み込みました', null);
  };
  reader.readAsText(file);
}

function listView(){
  var rows = activeTasks().slice();
  if(S.sort === 'due')       rows.sort(function(a,b){ return dueSortKey(a) - dueSortKey(b); });
  // 案件順は着工日の近い案件を先頭にまとめる（着工前が近い順 → 着工済み → 未設定）
  else if(S.sort === 'proj') rows.sort(function(a,b){ return cmpProjStart(proj(a.pj), proj(b.pj)) || dueSortKey(a) - dueSortKey(b); });
  else                       rows.sort(function(a,b){ return priRank(a) - priRank(b) || dueSortKey(a) - dueSortKey(b); });

  function sortBtn(key, label){
    return h('button', {
      style:S.sort === key ? tabOn : tabOff,
      onclick:function(){ setState({ sort:key }, { persist:false }); }
    }, label);
  }

  // タスク名と案件名で絞り込む。入力中に再描画するとフォーカスが飛ぶので、
  // 該当しない行を隠して件数表示だけを書き換える
  var rowRefs = [], groupRefs = [], countEl = null;
  var noHitEl = h('span', { style:'display:none; font-size:13px; color:oklch(0.72 0.008 260); padding:8px 2px;' }, '一致するタスクがありません。');

  // 案件順のときは案件ごとの見出しを挟む。着工日の状態を出して並び順の理由を見せる
  function projGroupHeader(p){
    var pc = projColor(p.hue), st = startChip(p.start);
    return h('div', { style:'flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:10px 2px 2px;' },
      h('span', { style:'width:10px; height:10px; border-radius:3px; background:' + pc + '; flex:0 0 auto;' }),
      h('span', { style:'font-size:13px; font-weight:700; color:' + pc + ';', text:p.name }),
      h('span', { style:st.style, text:st.text })
    );
  }

  var rowEls = [], curPj = null, curGroup = null;
  rows.forEach(function(t){
    if(S.sort === 'proj' && t.pj !== curPj){
      curPj = t.pj;
      curGroup = { el:projGroupHeader(proj(t.pj)), rows:[] };
      groupRefs.push(curGroup);
      rowEls.push(curGroup.el);
    }
    var el = taskRow(t);
    var ref = { key:(t.t + ' ' + proj(t.pj).name).toLowerCase(), el:el };
    if(S.sort === 'proj' && curGroup) curGroup.rows.push(ref);
    rowRefs.push(ref);
    rowEls.push(el);
  });

  function applyTaskSearch(q){
    q = (q || '').trim().toLowerCase();
    var hit = 0;
    rowRefs.forEach(function(r){
      var vis = !q || r.key.indexOf(q) >= 0;
      r.el.style.display = vis ? 'block' : 'none';
      if(vis) hit++;
    });
    // 中身が全部隠れた案件見出しも一緒に畳む
    groupRefs.forEach(function(g){
      var any = g.rows.some(function(r){ return r.el.style.display !== 'none'; });
      g.el.style.display = any ? 'flex' : 'none';
    });
    noHitEl.style.display = (hit === 0 && rows.length > 0) ? 'block' : 'none';
    if(countEl) countEl.textContent = q ? (hit + ' / ' + rows.length + '件') : (rows.length + '件');
  }

  return h('div', { style:'height:100%; display:flex; flex-direction:column; padding:16px 22px 18px;' },
    h('div', { style:'display:flex; align-items:center; gap:10px; padding-bottom:12px; flex-wrap:wrap;' },
      h('input', {
        placeholder:'🔍 タスク・案件名で検索',
        style:'flex:1 1 200px; min-width:150px; height:38px; padding:0 14px; border:1px solid oklch(0.88 0.005 95); border-radius:10px; font-size:14px; background:oklch(0.99 0.003 90); color:oklch(0.32 0.012 260); outline:none;',
        oninput:function(ev){ applyTaskSearch(ev.target.value); }
      }),
      h('span', { style:'font-size:12px; color:oklch(0.58 0.01 260);' }, '並び替え'),
      h('div', { style:'display:flex; padding:3px; gap:2px; background:oklch(0.93 0.005 95); border-radius:10px;' },
        sortBtn('due','期限日'), sortBtn('proj','案件・着工順'), sortBtn('pri','緊急・重要')),
      h('span', { style:'font-size:12px; color:oklch(0.6 0.01 260); font-variant-numeric:tabular-nums; white-space:nowrap;',

  function quadBtn(label, sub, u, i){

      recent = pick.filter(function(p){ return p.usedAt; })

      rest = pick.filter(function(p){ return recent.indexOf(p) < 0; });

        }),

          onclick:addNewProj

          h('input', {

      })()

  }else if(a.step === 2){
    body = h('div', {},
      h('span', { style:'font-size:13px; font-weight:700; color:oklch(0.5 0.01 260);' }, '② タスク名を入力'),
      h('div', { style:'display:flex; align-items:center; gap:8px; margin:12px 0;' },

/* データが読めなかった／保存できていないときの警告。

function alertBar(){
  var msg, detail;
  if(S.saveError === 'quota'){
    msg = '保存できていません（容量がいっぱいです）';
    detail = '⚙から書き出したうえで、不要なタスクを削除して整理してください。';
  }else if(S.saveError){
    msg = '保存できていません';
    detail = 'プライベートブラウズ中の可能性があります。通常のタブで開き直してください。';
  }else if(S.loadError === 'broken'){
    msg = '保存されていたデータを読み込めませんでした';
    detail = '中身は消さずに退避してあります。復旧が必要な場合はお知らせください。';

    msg = 'この端末ではデータを保存できません';
    detail = 'プライベートブラウズを解除するか、通常のタブで開き直してください。';
  }
  return h('div', { style:'flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:10px 18px; background:oklch(0.955 0.05 30); border-bottom:1px solid oklch(0.64 0.17 30); z-index:22;' },

        h('span', { style:'font-size:18px;' }, '‹'), 'ボードに戻る'),
      spacer(),
      h('span', { style:'font-size:16px; font-weight:700; color:oklch(0.34 0.012 260);' }, '🗄 アーカイブ'),
      spacer(),
      h('span', { style:'font-size:12px; color:oklch(0.6 0.01 260); font-variant-numeric:tabular-nums; width:120px; text-align:right;', text:rows.length + '件' })
    ),
    h('div', { style:'flex:1; min-height:0; overflow-y:auto; padding:18px 22px; display:flex; flex-direction:column; gap:8px;' },
      rows.map(function(t){
        var v = cardVisuals(t);
        return h('div', { style:'display:flex; align-items:center; gap:12px; padding:12px 16px; background:oklch(0.985 0.004 90); border:1px solid oklch(0.91 0.005 95); border-radius:11px; flex:0 0 auto;' },
          h('div', { style:'flex:0 0 5px; align-self:stretch; background:' + v.pc + '; border-radius:5px;' }),
          h('span', { style:v.projText, text:v.p.name }),
          h('span', { style:'flex:0 1 auto; font-size:15px; color:oklch(0.55 0.01 260); text-decoration:line-through; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;', text:t.t }),
          spacer(),
          h('span', { style:'font-size:12px; color:oklch(0.62 0.01 260);', text:fmtDue(t.due) }),
          h('button', { style:'padding:6px 12px; border:1px solid oklch(0.86 0.006 95); background:transparent; border-radius:9px; font-size:12px; color:oklch(0.45 0.01 260); cursor:pointer;', onclick:function(){ restoreTask(t.id); } }, '戻す')
        );
      }),
      rows.length === 0 ? h('span', { style:'font-size:13px; color:oklch(0.7 0.008 260); padding:8px 2px;' }, '完了済みのタスクはまだありません。') : null
    )
  );
}

function toastEl(){
  return h('div', { style:'position:absolute; bottom:22px; left:50%; transform:translateX(-50%); z-index:80; animation:toastIn .22s ease; display:flex; align-items:center; gap:16px; padding:12px 14px 12px 20px; background:oklch(0.28 0.006 260); color:oklch(0.97 0.004 90); border-radius:13px; box-shadow:0 18px 40px -16px oklch(0.2 0.02 260 / 0.6);' },
    h('span', { style:'font-size:14px;', text:S.toast.text }),
    S.toast.undo ? h('button', {
      style:'padding:6px 14px; border:none; background:oklch(0.55 0.11 250); color:oklch(0.99 0.01 250); border-radius:9px; font-size:13px; font-weight:700; cursor:pointer;',
      onclick:function(){ var u = S.toast && S.toast.undo; setState({ toast:null }, { persist:false }); if(u) u(); }
    }, '取り消し') : null
  );
}

/* ============================================================
   ルート描画
   ============================================================ */
var root = document.getElementById('app');

function render(){
  root.textContent = '';

  var content = h('div', { style:'position:relative; flex:1; min-height:0;' },
    S.view === 'matrix' ? matrixView() : listView(),
    (activeTasks().length === 0 && S.filter.length === 0) ? emptyHint() : null
  );

  root.appendChild(topBar());
  if(S.saveError || S.loadError) root.appendChild(alertBar());
  if(unclassifiedTasks().length > 0) root.appendChild(inboxBanner());
  root.appendChild(content);

  if(S.filterOpen)  filterDrawer().forEach(function(n){ root.appendChild(n); });
  if(S.triageOpen)  triageDrawer().forEach(function(n){ root.appendChild(n); });
  if(S.add)         root.appendChild(addModal());
  if(S.edit)        root.appendChild(editModal());
  if(S.settingsOpen)root.appendChild(settingsModal());
  if(S.projectsOpen)root.appendChild(projectsScreen());
  if(S.archiveOpen) root.appendChild(archiveScreen());
  if(S.toast)       root.appendChild(toastEl());
  if(S.updateReady) root.appendChild(updateBar());
}

window.addEventListener('pointerup', function(){ if(swipe) swUp(); });

/* ============================================================
   Service Worker
   ホーム画面に追加したあとオフラインで起動できるようにし、
   再デプロイ時は「更新」バーを出してから切り替える（勝手にリロードしない）。
   ============================================================ */
var swReg = null;
function watchWaiting(reg){
  if(reg.waiting && navigator.serviceWorker.controller){
    setState({ updateReady:true }, { persist:false });
  }
  reg.addEventListener('updatefound', function(){
    var nw = reg.installing;
    if(!nw) return;
    nw.addEventListener('statechange', function(){
      if(nw.state === 'installed' && navigator.serviceWorker.controller){
        setState({ updateReady:true }, { persist:false });
      }
    });
  });
}
function applyUpdate(){
  if(swReg && swReg.waiting){
    swReg.waiting.postMessage({ type:'SKIP_WAITING' });
  }else{
    location.reload();
  }
}
function checkForUpdate(){
  if(!swReg){ alert('この環境では自動更新は使えません。Safariでページを再読み込みしてください。'); return; }
  swReg.update().then(function(){
    setTimeout(function(){
      if(!S.updateReady) showToast('最新版を使っています', null);
    }, 800);
  }).catch(function(){
    showToast('更新を確認できませんでした', null);
  });
}
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      swReg = reg;
      watchWaiting(reg);
    }).catch(function(){ /* 登録できなくてもアプリ自体は動く */ });
  });
  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(reloading) return;
    reloading = true;
    location.reload();
  });
}

render();
})();
</script>
</body>
</html>
